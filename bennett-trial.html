/* 用真实班尼特立绘作为战斗形象：位移/倾斜/挤压/残影/粒子营造流畅动作（站桩战斗风格）
   人物底部对齐碰撞框底边，绘制尺寸略大于碰撞框；加载失败时由 drawBennett 兜底 */
function drawBennettImage(img, p){
  var g = ctx;
  g.save();
  var t = gameTime;
  g.translate(p.x + p.w/2, p.y + p.h);
  g.scale(p.facing, 1);
  // —— 动作变形（流畅感来源）——
  var tilt = 0, sx = 1, sy = 1;
  var moving = Math.abs(p.vx) > 40 && p.onGround;
  if(moving){ tilt = 0.05; }                                        // 跑动前倾
  if(!p.onGround){ tilt = p.vy < 0 ? 0.12 : -0.14; }               // 起跳前倾 / 下落后仰
  if(p.state==='attack'){
    tilt = (p.atk && p.atk.phase==='wind') ? -0.12 : 0.16;          // 施法：收手蓄力→前倾释放
  }
  if(p.state==='hurt'){ tilt = -0.16; }
  if(p.state==='dash'){ sx = 1.32; sy = 0.84; }                     // 冲刺拉伸
  if(p.ultT > 0){ sx = 1.12; sy = 1.12; }                           // 大招强化膨胀
  if(p.state==='dying'){ sy = 1 - p.deathT*0.3; sx = 1 + p.deathT*0.15; }
  g.rotate(tilt);
  g.scale(sx * (p.sx||1), sy * (p.sy||1));                          // 叠加跳跃/落地挤压
  // 跑动颠簸 / 施法浮动
  var bob = 0;
  if(moving) bob = Math.abs(Math.sin((p.runT||0)*11))*3;
  if(p.state==='attack' && p.atk) bob = Math.sin(p.atk.t*40)*1.5;
  g.translate(0, -bob);
  // 无敌帧闪烁
  if(p.invuln>0 && Math.floor(t*24)%2===0) g.globalAlpha *= 0.35;
  // 绘制立绘（方形透明 PNG，底部对齐，60×68 略大于碰撞框 46×64）
  var dw = 60, dh = 68;
  g.drawImage(img, -dw/2, -dh, dw, dh);
  // 施法星光（攻击出招时掌前聚光，增强动作反馈）
  if(p.state==='attack' && p.atk && p.atk.phase==='act'){
    var gx = 8, gy = -34;
    var gl = g.createRadialGradient(gx,gy,0,gx,gy,15);
    gl.addColorStop(0,'rgba(255,250,220,0.9)');
    gl.addColorStop(0.5,'rgba(255,224,102,0.6)');
    gl.addColorStop(1,'rgba(255,224,102,0)');
    g.fillStyle = gl;
    g.beginPath(); g.arc(gx,gy,15,0,6.2832); g.fill();
    g.fillStyle = '#fff8dc';
    g.beginPath(); g.arc(gx,gy,3,0,6.2832); g.fill();
  }
  // 受击红闪
  if(p.state==='hurt' && Math.floor(t*30)%2===0){
    g.globalAlpha = 0.4; g.fillStyle = '#ff5544';
    g.beginPath(); g.ellipse(0,-32,22,34,0,0,6.2832); g.fill();
    g.globalAlpha = 1;
  }
  // 大招金色光环
  if(p.ultT>0){
    g.globalAlpha = 0.5 + 0.3*Math.sin(t*10);
    g.strokeStyle = '#ffd23a'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0,-30,26,34,0,0,6.2832); g.stroke();
    g.globalAlpha = 1;
  }
  g.restore();
}

function formatTime(s){

/* ============================ 13. 主循环 ============================ */
var gameTime = 0;
function tick(realDt){
  var dt = Math.min(realDt||0.016, 0.05);
  // 暂停
  if(GAME.paused){
    if(just('KeyP')||just('Escape')) GAME.paused = false;
    render();
    return;
  }
  if(just('KeyP') && GAME.state==='fight') GAME.paused = true;
  if(freeze>0){
    freeze -= dt;
    updateFx(dt);
    updateParticles(dt);
    render();
    return;
  }
  update(dt);
  render();
}

function loop(ts){
  var dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  tick(dt);
  if(!window.__DSH_QA__) requestAnimationFrame(loop);
}
var lastTime = 0;

/* ============================ 14. 启动 & QA 钩子 ============================ */
function init(){
  setupCanvas();
  bindInput();
  bindTouchUI();
  checkOrientation();
  if(typeof window !== 'undefined' && window.addEventListener){
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
  }
  initAssets2();
  initBGState();
  resetPlayer();
  boss = null;
  gameTime = 0;
  GAME.startTime = 0;
  if(typeof requestAnimationFrame !== 'undefined' && !window.__DSH_QA__){
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
}
if(typeof window !== 'undefined'){
  window.__game = {
    tick:function(dt){ tick(dt); },
    get state(){ return GAME.state; },
    get level(){ return GAME.level; },
    get player(){ return player; },
    get boss(){ return boss; },
    get game(){ return GAME; },
    held:held,
    press:function(code){ pressed.push(code); },
    startLevel:startLevel,
    gotoTitle:gotoTitle,
    debug:{
      forceBossHp:function(v){ if(boss){ boss.hp = v; } },
      forcePlayerHp:function(v){ player.hp = v; },
      killBoss:function(){ if(boss && boss.state!=='dead' && boss.state!=='dying'){ boss.hp=0; bossDie(); } },
      setState:setState,
      skipIntro:function(){ if(GAME.state==='intro') setState('fight'); }
    }
  };
  if(typeof document !== 'undefined' && document.readyState !== 'loading'){
    init();
  } else if(typeof document !== 'undefined'){
    document.addEventListener('DOMContentLoaded', init);
  }
}
</script>
